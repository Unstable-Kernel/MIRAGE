[project]
name = "mirage-engineering"
dynamic = ["version"]
description = "AI-native engineering compiler and runtime for robotics and autonomous systems"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MPL-2.0" }
authors = [{ name = "Erebuzzz", email = "kshitiz23kumar@gmail.com" }]
keywords = ["robotics", "engineering", "compiler", "autonomous-systems", "engineering-intermediate-representation"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
  "httpx>=0.27,<1",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<2",
  "pytest-cov>=5,<6",
  "ruff>=0.6,<1",
  "mypy>=1.10,<2",
]

[project.optional-dependencies]
# Duplicated from the dev dependency group above so pip-based CI installs work too.
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<2",
  "pytest-cov>=5,<6",
  "ruff>=0.6,<1",
  "mypy>=1.10,<2",
]
providers = [
  "openai>=1.40,<2",
  "anthropic>=0.34,<1",
]

[project.scripts]
mirage = "mirage.cli:app"

[project.urls]
Homepage = "https://github.com/Unstable-Kernel/MIRAGE"
Documentation = "https://github.com/Unstable-Kernel/MIRAGE#readme"
Repository = "https://github.com/Unstable-Kernel/MIRAGE"
Issues = "https://github.com/Unstable-Kernel/MIRAGE/issues"

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "packages", "adapters"]
addopts = "-ra"
markers = [
  "e2e: mocked end-to-end architecture tests",
  "provider_smoke: opt-in live provider or local-server smoke tests",
]

[tool.ruff]
line-length = 260
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/mirage/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mirage"]
