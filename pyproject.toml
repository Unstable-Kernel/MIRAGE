[project]
name = "mirage"
version = "0.1.0"
description = "AI-native engineering compiler and runtime for robotics and autonomous systems"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MPL-2.0" }
authors = [{ name = "Erebuzzz", email = "kshitiz23kumar@gmail.com" }]
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "pytest-cov>=5,<6",
  "ruff>=0.6,<1",
  "mypy>=1.10,<2",
]
providers = [
  "openai>=1.40,<2",
  "anthropic>=0.34,<1",
]

[project.scripts]
mirage = "mirage.cli:app"

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "packages", "adapters"]
addopts = "-ra"
markers = [
  "e2e: mocked end-to-end architecture tests",
  "provider_smoke: opt-in live provider or local-server smoke tests",
]

[tool.ruff]
line-length = 180
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mirage"]
